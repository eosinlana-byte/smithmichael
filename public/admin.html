<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smith Michael Admin</title><style>:root{--bg:#121212;--ink:#F4F1EA;--muted:#9AA3B2;--line:rgba(244,241,234,.14);--card:#171C24;--accent:#E8A54B;--side:#0E1116}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Inter,Arial,sans-serif}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:var(--side);color:#fff;padding:24px 15px;display:flex;flex-direction:column;gap:8px}.side strong{font-size:18px;padding:0 10px 25px}.side button{background:transparent;color:#aaa;border:0;text-align:left;padding:12px 10px;border-radius:6px;font:inherit;cursor:pointer}.side button.on,.side button:hover{background:#292929;color:#fff}.view-site{color:#E8A54B;text-decoration:none;padding:12px 10px;margin-top:auto}.side #logout{margin-top:0}.main{padding:32px;max-width:1200px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:28px}.card,table{background:var(--card);border:1px solid var(--line)}table{width:100%;border-collapse:collapse}.card{padding:22px}th,td{text-align:left;padding:14px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}td{font-size:14px;word-break:break-word}td a{color:var(--accent);text-decoration:none}td a:hover{text-decoration:underline}.btn{border:0;background:var(--ink);color:#fff;padding:10px 15px;cursor:pointer;font-weight:bold}.btn.add{background:var(--accent);color:var(--ink)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#9d3e35}.row-actions{display:flex;gap:7px;flex-wrap:wrap}.hidden{display:none!important}.modal{position:fixed;inset:0;display:none;place-items:center;padding:20px}.modal.open{display:grid}.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}.modal-card{position:relative;width:min(500px,100%);background:var(--card);padding:26px;z-index:1}.modal h2{margin-top:0}label{display:grid;gap:7px;margin:14px 0;font-weight:bold;font-size:13px}input,textarea{font:inherit;padding:11px;border:1px solid var(--line);width:100%;background:#121212;color:var(--ink)}.modal-actions{display:flex;gap:8px;margin-top:18px}.empty{padding:24px;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;background:#171717;color:#fff;padding:13px 17px;display:none}.toast.show{display:block}@media(max-width:760px){.app{display:block}.side{flex-direction:row;flex-wrap:wrap;align-items:center}.side strong{width:100%;padding-bottom:10px}.side #logout{margin-left:auto}.main{padding:20px;overflow:hidden}.top{align-items:flex-start;gap:12px}.top h1{font-size:23px}.table-wrap{overflow:visible}table,thead,tbody,tr,td{display:block;width:100%}thead{display:none}tr{background:var(--card);border:1px solid var(--line);margin-bottom:12px;padding:8px}td{border:0;padding:7px 8px}td:before{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}#enquiryRows td:nth-child(1):before{content:'Date'}#enquiryRows td:nth-child(2):before{content:'Name'}#enquiryRows td:nth-child(3):before{content:'Email'}#enquiryRows td:nth-child(4):before{content:'Project'}#enquiryRows td:nth-child(5):before{content:'Budget'}#enquiryRows td:nth-child(6):before{content:'Message'}#portfolioRows td:nth-child(1):before{content:'Name'}#portfolioRows td:nth-child(2):before{content:'Description'}#portfolioRows td:nth-child(3):before{content:'Tags'}#portfolioRows td:nth-child(4):before{content:'Actions'}#testimonialRows td:nth-child(1):before{content:'Quote'}#testimonialRows td:nth-child(2):before{content:'Client'}#testimonialRows td:nth-child(3):before{content:'Role'}#testimonialRows td:nth-child(4):before{content:'Actions'}}</style></head><body><div class="app"><aside class="side"><strong><img src="/assets/smith-mark.jpg" alt="" style="width:38px;height:30px;object-fit:contain;vertical-align:middle;margin-right:8px">SMITH MICHAEL</strong><button class="tab on" data-tab="portfolio">Portfolio</button><button class="tab" data-tab="testimonials">Testimonials</button><button class="tab" data-tab="enquiries">Enquiries</button><a class="view-site" href="/" target="_blank">View Website ↗</a><button id="logout">Log out</button></aside><main class="main"><section id="portfolio"><div class="top"><h1>Portfolio</h1><button class="btn add" id="addPortfolio">Add work</button></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Description</th><th>Tags</th><th>Actions</th></tr></thead><tbody id="portfolioRows"></tbody></table></div></section><section id="testimonials" class="hidden"><div class="top"><h1>Testimonials</h1><button class="btn add" id="addTestimonial">Add testimonial</button></div><div class="table-wrap"><table><thead><tr><th>Quote</th><th>Client</th><th>Role</th><th>Actions</th></tr></thead><tbody id="testimonialRows"></tbody></table></div></section><section id="enquiries" class="hidden"><div class="top"><h1>Enquiries</h1></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Project</th><th>Budget</th><th>Message</th></tr></thead><tbody id="enquiryRows"></tbody></table></div></section></main></div><div class="modal" id="portfolioModal"><div class="backdrop"></div><form class="modal-card" id="portfolioForm"><h2 id="portfolioModalTitle">Add work</h2><input type="hidden" id="portfolioId"><label>Name<input id="portfolioName" required></label><label>Description<input id="portfolioDescription" required></label><label>Website URL<input id="portfolioUrl" type="url"></label><label>Thumbnail image<input id="portfolioImage" type="file" accept="image/*"></label><label>Tags<input id="portfolioTags" placeholder="DESIGN, FRONTEND"></label><div class="modal-actions"><button class="btn add">Save</button><button class="btn ghost cancel" type="button">Cancel</button></div></form></div><div class="modal" id="testimonialModal"><div class="backdrop"></div><form class="modal-card" id="testimonialForm"><h2 id="testimonialModalTitle">Add testimonial</h2><input type="hidden" id="testimonialId"><label>Quote<textarea id="testimonialQuote" rows="5" required></textarea></label><label>Client<input id="testimonialClient" required></label><label>Role<input id="testimonialRole"></label><div class="modal-actions"><button class="btn add">Save</button><button class="btn ghost cancel" type="button">Cancel</button></div></form></div><div id="toast" class="toast"></div><script src="/js/admin.js?v=1"></script></body></html>
